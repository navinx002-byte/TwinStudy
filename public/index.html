<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TwinStudy — A Digital Twin That Understands, Verifies and Guides Every Student</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & Babel for Browser Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          colors: {
            mint: '#A8E6CF',
            skyPastel: '#DCEEFA',
            cyanAccent: '#00C4CC',
            cyanHover: '#00A8AF',
            navySlate: '#0E131F',
            navyCard: '#151C2E',
            navyBorder: '#232D45',
          }
        }
      }
    }
  </script>

  <style>
    /* Modern, Clean SaaS Font Style Restored */
    html, body, *, input, button, select, textarea {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    }

    body {
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(135deg, #A8E6CF 0%, #DCEEFA 100%);
      background-attachment: fixed;
      color: #0E131F;
    }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 30px rgba(14, 19, 31, 0.05);
    }

    .glass-dark-panel {
      background: rgba(14, 19, 31, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      color: #f8fafc;
    }

    .btn-cyan {
      background-color: #00C4CC;
      color: #0E131F;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .btn-cyan:hover {
      background-color: #00A8AF;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 196, 204, 0.35);
    }

    html {
      scroll-behavior: smooth;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(14, 19, 31, 0.25); border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen selection:bg-cyanAccent selection:text-navySlate">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PALETTE_COLORS = [
      { name: "Cyan", hex: "#00C4CC" },
      { name: "Emerald", hex: "#10B981" },
      { name: "Purple", hex: "#8B5CF6" },
      { name: "Amber", hex: "#F59E0B" },
      { name: "Rose", hex: "#EC4899" },
      { name: "Blue", hex: "#3B82F6" },
      { name: "Indigo", hex: "#6366F1" },
      { name: "Teal", hex: "#14B8A6" },
    ];

    const DAYS_OF_WEEK = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

    function App() {
      // Main View state: 'landing', 'auth', 'app'
      const [view, setView] = useState("landing");

      // App Internal Page: 'dashboard', 'timetable', 'simulator', 'focus_telemetry', 'parent_view', 'proof', 'scoreboard', 'twin_mind', 'privacy'
      const [appPage, setAppPage] = useState("dashboard");

      // Auth tabs: 'login', 'register', 'forgot'
      const [authTab, setAuthTab] = useState("login");
      const [authError, setAuthError] = useState(null);
      const [authSuccess, setAuthSuccess] = useState(null);
      const [loadingAction, setLoadingAction] = useState(false);

      // Register Form State (Email OTP Verification Flow)
      const [regName, setRegName] = useState("");
      const [regDob, setRegDob] = useState("");
      const [regAge, setRegAge] = useState("");
      const [regEmail, setRegEmail] = useState("");
      const [regPassword, setRegPassword] = useState("");
      const [regConfirmPassword, setRegConfirmPassword] = useState("");
      const [regOtp, setRegOtp] = useState("");
      const [regOtpSent, setRegOtpSent] = useState(false);
      const [regCountdown, setRegCountdown] = useState(0);
      const [regDemoOtp, setRegDemoOtp] = useState(null);
      const [fallbackCode, setFallbackCode] = useState(null);
      const [forgotDemoOtp, setForgotDemoOtp] = useState(null);
      const [patternCategoryFilter, setPatternCategoryFilter] = useState("all");

      // Role Selection & Parent Dashboard State
      const [userRole, setUserRole] = useState("student"); // "student" or "parent"
      const [regRole, setRegRole] = useState("student"); // "student" or "parent"
      const [regParentLinkingCode, setRegParentLinkingCode] = useState("");
      const [regMinorParentEmail, setRegMinorParentEmail] = useState("");
      const [regMinorParentName, setRegMinorParentName] = useState("");
      const [parentDashboardData, setParentDashboardData] = useState(null);
      const [parentActiveTab, setParentActiveTab] = useState("overview");
      const [studentParentSettings, setStudentParentSettings] = useState(null);
      const [parentUser, setParentUser] = useState(null);
      const [parentManualLinkingCode, setParentManualLinkingCode] = useState("");

      // Login Form State
      const [loginIdentifier, setLoginIdentifier] = useState("");
      const [loginPassword, setLoginPassword] = useState("");

      // Ensure login fields start completely empty with no browser autofill
      useEffect(() => {
        if (view === "auth" && authTab === "login") {
          setLoginIdentifier("");
          setLoginPassword("");
          setAuthError(null);
        }
      }, [view, authTab]);

      // Forgot Password State
      const [forgotEmail, setForgotEmail] = useState("");
      const [forgotOtp, setForgotOtp] = useState("");
      const [forgotNewPass, setForgotNewPass] = useState("");
      const [forgotConfirmPass, setForgotConfirmPass] = useState("");
      const [forgotOtpSent, setForgotOtpSent] = useState(false);

      // SETTINGS STATE (STUDENT PROFILE & SMTP CONFIGURATION)
      const [settingsName, setSettingsName] = useState("Adarsh");
      const [settingsSemester, setSettingsSemester] = useState("Semester 5");
      const [settingsCourse, setSettingsCourse] = useState("B.Tech Computer Science & Engineering");
      const [settingsCollege, setSettingsCollege] = useState("Nitte Meenakshi Institute of Technology");
      const [settingsDob, setSettingsDob] = useState("2002-05-15");
      const [settingsAge, setSettingsAge] = useState("24");
      const [settingsGuardianEmail, setSettingsGuardianEmail] = useState("parent.guardian@gmail.com");
      const [settingsHours, setSettingsHours] = useState("6.0");
      const [testEmailTarget, setTestEmailTarget] = useState("");
      const [smtpTestResult, setSmtpTestResult] = useState(null);

      // PROOF-BASED TASK UPLOAD & DYNAMIC QUIZ STATE
      const [proofFile, setProofFile] = useState(null);
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [quizFeedback, setQuizFeedback] = useState(null);
      const proofFileInputRef = React.useRef(null);

      // PART 1: TWIN CONTINUOUS LEARNING STATE
      const [twinHealth, setTwinHealth] = useState({
        personalization_score: 84,
        data_coverage: 78,
        decision_history_count: 14,
        feedback_received_count: 6,
        prediction_accuracy: 92.5
      });
      const [behaviorPatterns, setBehaviorPatterns] = useState([]);
      const [twinDecisions, setTwinDecisions] = useState([]);
      const [showCorrectPatternModal, setShowCorrectPatternModal] = useState(false);
      const [editingPattern, setEditingPattern] = useState(null);
      const [showFeedbackModal, setShowFeedbackModal] = useState(false);
      const [feedbackDecision, setFeedbackDecision] = useState(null);
      const [feedbackRating, setFeedbackRating] = useState(5);
      const [feedbackOutcomeText, setFeedbackOutcomeText] = useState("");
      const [feedbackNotes, setFeedbackNotes] = useState("");

      // PART 2: ACADEMIC GRADES & CGPA STATE
      const [gradesOverview, setGradesOverview] = useState({
        cgpa_10: 9.20,
        cgpa_4: 3.68,
        total_credits: 16.0,
        subject_breakdown: [],
        grades: []
      });
      const [showRecordGradeModal, setShowRecordGradeModal] = useState(false);
      const [gradeSubjectId, setGradeSubjectId] = useState("");
      const [gradeAssessmentName, setGradeAssessmentName] = useState("");
      const [gradeScore, setGradeScore] = useState("");
      const [gradeMaxScore, setGradeMaxScore] = useState("100");
      const [gradeWeight, setGradeWeight] = useState("20");
      const [gradeNotes, setGradeNotes] = useState("");
      const [gradeSearchQuery, setGradeSearchQuery] = useState("");

      // SMTP Configuration State
      const [showSmtpModal, setShowSmtpModal] = useState(false);
      const [smtpStatus, setSmtpStatus] = useState({ configured: false, sender_email: "" });
      const [smtpSender, setSmtpSender] = useState("");
      const [smtpPass, setSmtpPass] = useState("");
      const [smtpMessage, setSmtpMessage] = useState(null);

      // Core State from Backend
      const [state, setState] = useState(null);
      const [simQuery, setSimQuery] = useState("what if i will go to trip 2 days");
      const [simResult, setSimResult] = useState(null);
      const [toast, setToast] = useState(null);
      const [proofModalTask, setProofModalTask] = useState(null);
      const [quizAnswer, setQuizAnswer] = useState("");
      const [showAddTaskModal, setShowAddTaskModal] = useState(false);
      const [newTaskTitle, setNewTaskTitle] = useState("");
      const [newTaskSubject, setNewTaskSubject] = useState("");
      const [newTaskDueDays, setNewTaskDueDays] = useState(3);
      const [newTaskPriority, setNewTaskPriority] = useState("High");
      const [newTaskHours, setNewTaskHours] = useState(2.5);

      // Timetable Filter tab in dashboard
      const [scheduleFilterDay, setScheduleFilterDay] = useState("All");

      // Notifications Bell State
      const [showNotifications, setShowNotifications] = useState(false);
      const [notificationsList, setNotificationsList] = useState([]);

      // =============================================================
      // FOCUS MODE & STUDY TELEMETRY STATE (Matches Image 4)
      // =============================================================
      const [focusDurationPreset, setFocusDurationPreset] = useState(45); // 25, 45, 60, 90
      const [focusTimeRemaining, setFocusTimeRemaining] = useState(45 * 60);
      const [isFocusRunning, setIsFocusRunning] = useState(false);
      const [focusSubject, setFocusSubject] = useState("General Study");
      const [focusActiveTask, setFocusActiveTask] = useState("No linked task");

      // Feature Card Deep Dive Modal
      const [activeFeatureModal, setActiveFeatureModal] = useState(null);

      // Onboarding & Timetable Setup Modal
      const [showSetupModal, setShowSetupModal] = useState(false);
      const [setupStep, setSetupStep] = useState(1);
      const [academicProfile, setAcademicProfile] = useState({
        student_name: "",
        college: "",
        course: "",
        specialization: "",
        semester: "",
        academic_year: "2026-27",
        term_start: "",
        term_end: "",
        timetable_type: "weekly"
      });
      const [subjectsList, setSubjectsList] = useState([]);
      const [newSubject, setNewSubject] = useState({
        name: "",
        code: "",
        teacher: "",
        room: "",
        credits: "",
        color: "#00C4CC",
        type: "Lecture"
      });
      const [editingSubjectIndex, setEditingSubjectIndex] = useState(null);
      const [classesList, setClassesList] = useState([]);
      const [newSession, setNewSession] = useState({
        subject_id: "",
        subject: "",
        day: "Monday",
        start_time: "10:00",
        end_time: "11:30",
        teacher: "",
        room: "",
        type: "Lecture",
        color: "#00C4CC",
        week_type: "All"
      });

      // FAQ Chatbot (Study Buddy)
      const [showFaqBot, setShowFaqBot] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { role: "assistant", content: "👋 Hi! I am Study Buddy, your TwinStudy AI companion. Ask me anything about your timetable, classes, What-If simulations, or study recommendations!" }
      ]);
      const [chatInput, setChatInput] = useState("");
      const chatEndRef = useRef(null);
      const chatContainerRef = useRef(null);

      // Auto-scroll to the latest question or answer smoothly
      const scrollToChatBottom = () => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: "smooth" });
        } else if (chatContainerRef.current) {
          chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
        }
      };

      useEffect(() => {
        if (showFaqBot) {
          scrollToChatBottom();
          const timer = setTimeout(scrollToChatBottom, 350);
          return () => clearTimeout(timer);
        }
      }, [chatMessages, showFaqBot]);

      // Focus Mode Countdown Timer
      useEffect(() => {
        let interval = null;
        if (isFocusRunning && focusTimeRemaining > 0) {
          interval = setInterval(() => {
            setFocusTimeRemaining(t => t - 1);
          }, 1000);
        } else if (isFocusRunning && focusTimeRemaining === 0) {
          setIsFocusRunning(false);
          handleFinishFocusSession();
        }
        return () => clearInterval(interval);
      }, [isFocusRunning, focusTimeRemaining]);

      const handlePresetChange = (mins) => {
        setIsFocusRunning(false);
        setFocusDurationPreset(mins);
        setFocusTimeRemaining(mins * 60);
      };

      const handleResetFocusTimer = () => {
        setIsFocusRunning(false);
        setFocusTimeRemaining(focusDurationPreset * 60);
      };

      const handleFinishFocusSession = async () => {
        try {
          const res = await fetch("/api/telemetry/log-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              duration_minutes: focusDurationPreset,
              subject: focusSubject
            })
          });
          const data = await res.json();
          if (res.ok) {
            showNotification(`🎉 Great focus! +${data.points_earned} pts logged to your study telemetry.`);
            await fetchState();
          }
        } catch (e) {
          showNotification("Focus session completed!");
        }
      };

      // OTP Resend Countdown
      useEffect(() => {
        let timer;
        if (regCountdown > 0) {
          timer = setInterval(() => setRegCountdown(c => c - 1), 1000);
        }
        return () => clearInterval(timer);
      }, [regCountdown]);

      const [isChatLoading, setIsChatLoading] = useState(false);
      const [chatConversationId, setChatConversationId] = useState(null);

      useEffect(() => {
        const bootstrapAuth = async () => {
          const token = localStorage.getItem("twinstudy_auth_token");
          const storedEmail = localStorage.getItem("twinstudy_user_email");

          if (token || storedEmail) {
            try {
              const res = await fetch("/api/auth/me", {
                headers: {
                  ...(token ? { "Authorization": `Bearer ${token}` } : {}),
                  ...(storedEmail ? { "x-user-email": storedEmail } : {})
                }
              });
              if (res.ok) {
                const data = await res.json();
                if (data.status === "success" && data.user) {
                  const role = data.role || data.user.role || "student";
                  setUserRole(role);
                  localStorage.setItem("twinstudy_user_role", role);
                  localStorage.setItem("twinstudy_user_email", data.user.email);
                  if (role === "parent") {
                    setParentUser(data.user);
                    setView("parent_dashboard");
                    await fetchParentDashboard(data.user.email);
                  } else {
                    setView("app");
                    await fetchState(data.user.email);
                    await fetchStudentParentSettings();
                  }
                  checkSmtpStatus();
                  return;
                }
              }
            } catch (e) {
              console.error("Auth restoration failed:", e);
            }
          }
          fetchState();
          checkSmtpStatus();
        };

        bootstrapAuth();
      }, []);

      // ---------------- REAL STUDY BUDDY AI CHATBOT ----------------
      const handleAskFaq = async (query) => {
        if (!query || !query.trim() || isChatLoading) return;
        const userText = query.trim();
        const newMessages = [...chatMessages, { role: "user", content: userText }];
        setChatMessages(newMessages);
        setChatInput("");
        setIsChatLoading(true);

        try {
          const token = localStorage.getItem("twinstudy_auth_token");
          const email = localStorage.getItem("twinstudy_user_email") || state?.user?.email || "";
          const res = await fetch("/api/chat/message", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(token ? { "Authorization": `Bearer ${token}` } : {}),
              ...(email ? { "x-user-email": email } : {})
            },
            body: JSON.stringify({
              message: userText,
              conversation_id: chatConversationId
            })
          });
          const data = await res.json();
          if (res.ok && data.response) {
            if (data.conversation_id) setChatConversationId(data.conversation_id);
            setChatMessages([...newMessages, { role: "assistant", content: data.response }]);
          } else {
            setChatMessages([...newMessages, { role: "assistant", content: data.message || "I encountered an issue retrieving your study data. Please try again." }]);
          }
        } catch (err) {
          setChatMessages([...newMessages, { role: "assistant", content: "Network error connecting to Study Buddy AI. Please check server connection." }]);
        } finally {
          setIsChatLoading(false);
        }
      };

      const handleSaveSmtp = async (e) => {
        if (e) e.preventDefault();
        if (!smtpSender.trim() || !smtpPass.trim()) {
          showNotification("⚠️ Please enter both your Gmail address and 16-character App Password.");
          return;
        }
        try {
          const res = await fetch("/api/auth/configure-smtp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sender_email: smtpSender.trim(),
              sender_password: smtpPass.trim()
            })
          });
          const data = await res.json();
          if (res.ok) {
            showNotification("✓ Gmail SMTP credentials saved and verified successfully!");
            setSmtpStatus({ configured: true, sender_email: smtpSender.trim() });
          } else {
            showNotification(`⚠️ ${data.message || 'Failed to configure SMTP'}`);
          }
        } catch (err) {
          showNotification("Error saving SMTP credentials.");
        }
      };

      const handleResetTwinWeights = async () => {
        try {
          const res = await fetch("/api/twin/reset", { method: "POST" });
          const data = await res.json();
          if (res.ok) {
            showNotification("✓ Digital Twin reset to initial baseline weights.");
            await fetchTwinHealth();
          }
        } catch (e) {
          showNotification("Error resetting Twin.");
        }
      };

      const handleTogglePrivacy = async (key, currentValue) => {
        try {
          const res = await fetch("/api/privacy/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key, value: !currentValue })
          });
          const data = await res.json();
          if (res.ok) {
            showNotification(`✓ Privacy setting updated for ${key}`);
            await fetchState();
          } else {
            showNotification(data.message || "Failed to update setting");
          }
        } catch (e) {
          showNotification("Error updating privacy setting");
        }
      };

      const handleAdoptDecision = async (chosenType) => {
        if (!simResult) return;
        const isB = chosenType === "B";
        const question = simQuery || "What-if simulation decision";
        const recScenario = simResult.futureB?.focus || "Twin Strategy";
        const chosenScenario = isB ? recScenario : (simResult.futureA?.focus || "Student Idea Override");
        const isDisagreement = !isB;
        const token = localStorage.getItem("twinstudy_auth_token");
        const email = localStorage.getItem("twinstudy_user_email") || state?.user?.email || "";
        
        try {
          // Call new relational decision feedback endpoint
          await fetch("/api/decisions/feedback", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(token ? { "Authorization": `Bearer ${token}` } : {}),
              ...(email ? { "x-user-email": email } : {})
            },
            body: JSON.stringify({
              decision_id: simResult.decision_id || "",
              agreement: isB ? "agree" : "disagree",
              chosen_option: isB ? "Option B" : "Option A",
              user_reason: isDisagreement ? "Student chose manual override" : "Accepted Twin recommendation"
            })
          });

          // Also log to twin decisions
          const res = await fetch("/api/twin/decisions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question,
              recommended_scenario: recScenario,
              chosen_scenario: chosenScenario,
              user_reason: isDisagreement ? "Student chose manual override" : "Accepted Twin recommendation",
              is_disagreement: isDisagreement
            })
          });
          const data = await res.json();
          if (res.ok) {
            if (isDisagreement) {
              showNotification("⚡ Override recorded! Twin behavioral weights recalibrated to your preference.");
            } else {
              showNotification("✅ Twin Strategy adopted! Decision logged to behavioral memory (+80 pts).");
            }
            await fetchTwinHealth();
            await fetchState();
          } else {
            showNotification(data.message || "Failed to log decision");
          }
        } catch (e) {
          showNotification("Decision recorded locally.");
        }
      };

      const handleDeletePattern = async (patternId) => {
        try {
          const res = await fetch("/api/twin/pattern/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pattern_id: patternId })
          });
          const data = await res.json();
          if (res.ok) {
            showNotification("✓ Pattern archived from active simulation weighting.");
            await fetchTwinHealth();
          }
        } catch (e) {
          showNotification("Error deleting pattern.");
        }
      };

      const handleSaveCorrectPattern = async () => {
        if (!editingPattern) return;
        try {
          const res = await fetch("/api/twin/pattern/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(editingPattern)
          });
          const data = await res.json();
          if (res.ok) {
            showNotification("✓ Behavioral pattern updated successfully!");
            setShowCorrectPatternModal(false);
            setEditingPattern(null);
            await fetchTwinHealth();
          } else {
            showNotification(data.message || "Failed to update pattern.");
          }
        } catch (e) {
          showNotification("Error updating pattern.");
        }
      };

      const handleSubmitRealityFeedback = async () => {
        if (!feedbackDecision) return;
        try {
          const res = await fetch("/api/twin/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              decision_id: feedbackDecision.id,
              actual_outcome: feedbackOutcomeText,
              outcome_rating: feedbackRating,
              outcome_feedback: feedbackNotes
            })
          });
          const data = await res.json();
          if (res.ok) {
            showNotification("✓ Reality feedback logged! Prediction accuracy updated.");
            setShowFeedbackModal(false);
            setFeedbackDecision(null);
            await fetchTwinHealth();
          } else {
            showNotification(data.message || "Failed to log feedback.");
          }
        } catch (e) {
          showNotification("Error logging feedback.");
        }
      };

      const handleRecordNewGrade = async () => {
        if (!gradeSubjectId || !gradeAssessmentName || !gradeScore) {
          showNotification("Please select a subject and enter assessment name & score.");
          return;
        }
        try {
          const selectedSub = (state?.subjects || []).find(s => (s.id === gradeSubjectId || s.name === gradeSubjectId));
          const subName = selectedSub ? selectedSub.name : gradeSubjectId;
          const res = await fetch("/api/grades/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              subject_id: gradeSubjectId,
              subject_name: subName,
              assessment_name: gradeAssessmentName,
              score: parseFloat(gradeScore) || 0,
              max_score: parseFloat(gradeMaxScore) || 100,
              weight: parseFloat(gradeWeight) || 20,
              notes: gradeNotes
            })
          });
          const data = await res.json();
          if (res.ok) {
            showNotification("✓ Academic grade recorded successfully!");
            setShowRecordGradeModal(false);

            const bMonth = parseInt(parts[1], 10);

            const now = new Date();
            let age = now.getFullYear() - bYear;
            if (now.getMonth() + 1 < bMonth || (now.getMonth() + 1 === bMonth && now.getDate() < bDay)) {

                      key={idx}
                      onClick={() => handleAskFaq(chip)}
                      className="px-2.5 py-1 rounded-full bg-white border border-navySlate/15 text-navySlate hover:border-cyanAccent transition text-[10px] font-bold shadow-sm whitespace-nowrap"
                    >
                      {chip}
                    </button>
                  ))}
                </div>

                <div ref={chatContainerRef} className="flex-1 overflow-y-auto space-y-2.5 pr-1 text-xs scroll-smooth">
                  {chatMessages.map((m, i) => (
                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`p-3 rounded-2xl max-w-[85%] leading-relaxed whitespace-pre-wrap ${m.role === 'user' ? 'btn-cyan rounded-tr-none shadow-sm' : 'bg-white border border-navySlate/10 text-navySlate font-medium rounded-tl-none shadow-sm'}`}>
                        {m.content}
                      </div>
                    </div>
                  ))}
                  {isChatLoading && (
                    <div className="flex justify-start">
                      <div className="p-3 rounded-2xl bg-white border border-navySlate/10 text-navySlate font-medium rounded-tl-none shadow-sm flex items-center gap-1.5 text-xs text-navySlate/60">
                        <span className="w-1.5 h-1.5 rounded-full bg-cyanHover animate-bounce"></span>
                        <span className="w-1.5 h-1.5 rounded-full bg-cyanHover animate-bounce [animation-delay:0.2s]"></span>
                        <span className="w-1.5 h-1.5 rounded-full bg-cyanHover animate-bounce [animation-delay:0.4s]"></span>
                        <span className="text-[11px] ml-1">Study Buddy is analyzing your database...</span>
                      </div>
                    </div>
                  )}
                  <div ref={chatEndRef} className="h-1" />
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    if (!chatInput.trim()) return;
                    handleAskFaq(chatInput.trim());
                  }}
                  className="flex gap-2 pt-2 border-t border-navySlate/10 shrink-0"
                >
                  <input
                    type="text"
                    placeholder="Ask Study Buddy about your schedule & twin..."
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    className="flex-1 bg-white border border-navySlate/20 rounded-xl px-3 py-2 text-xs text-navySlate placeholder:text-navySlate/40 focus:outline-none focus:border-cyanAccent"
                  />
                  <button type="submit" className="px-3.5 py-2 btn-cyan rounded-xl text-xs font-extrabold shadow-sm">
                    ➔
                  </button>
                </form>

              </div>
            )}

            <button
              onClick={() => setShowFaqBot(!showFaqBot)}
              className="group relative flex items-center justify-center w-14 h-14 rounded-2xl bg-navySlate text-cyanAccent shadow-2xl hover:scale-105 active:scale-95 transition border-2 border-cyanAccent/50"
              title="Click to chat with Study Buddy"
            >
              <span className="text-2xl animate-pulse">✨</span>
              <span className="absolute -top-1.5 -right-1.5 flex h-3.5 w-3.5">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyanAccent opacity-75"></span>
                <span className="relative inline-flex rounded-full h-3.5 w-3.5 bg-cyanAccent"></span>
              </span>
            </button>

          </div>

          {/* MODAL 1: CORRECT LEARNED BEHAVIOR PATTERN */}
          {showCorrectPatternModal && editingPattern && (
            <div className="fixed inset-0 bg-navySlate/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-panel p-6 rounded-3xl max-w-md w-full space-y-4 border border-white shadow-2xl">
                <div className="flex justify-between items-center border-b border-navySlate/10 pb-3">
                  <h3 className="font-extrabold text-base text-navySlate">Correct Behavioral Pattern</h3>
                  <button onClick={() => setShowCorrectPatternModal(false)} className="text-navySlate/60 hover:text-navySlate font-bold">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-navySlate mb-1">Pattern Title *</label>
                    <input
                      type="text"
                      value={editingPattern.title}
                      onChange={(e) => setEditingPattern({ ...editingPattern, title: e.target.value })}
                      className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs focus:outline-none focus:border-cyanAccent"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-navySlate mb-1">Pattern Type</label>
                      <select
                        value={editingPattern.pattern_type}
                        onChange={(e) => setEditingPattern({ ...editingPattern, pattern_type: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs bg-white focus:outline-none"
                      >
                        <option value="productivity">Productivity</option>
                        <option value="prioritization">Prioritization</option>
                        <option value="deadline_habit">Deadline Habit</option>
                        <option value="fatigue">Fatigue & Stamina</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-navySlate mb-1">Weight Multiplier</label>
                      <input
                        type="number"
                        step="0.05"
                        min="0.5"
                        max="3.0"
                        value={editingPattern.weight}
                        onChange={(e) => setEditingPattern({ ...editingPattern, weight: parseFloat(e.target.value) || 1.0 })}
                        className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-navySlate mb-1">Confidence (%)</label>
                      <input
                        type="number"
                        min="0"
                        max="100"
                        value={editingPattern.confidence}
                        onChange={(e) => setEditingPattern({ ...editingPattern, confidence: parseFloat(e.target.value) || 50 })}
                        className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-navySlate mb-1">Status</label>
                      <button
                        type="button"
                        onClick={() => setEditingPattern({ ...editingPattern, is_active: !editingPattern.is_active })}
                        className={`w-full py-2 rounded-xl font-bold text-xs border ${editingPattern.is_active ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-slate-100 text-slate-600 border-slate-300'}`}
                      >
                        {editingPattern.is_active ? 'Active in Model' : 'Muted'}
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-navySlate mb-1">Evidence Summary / Reason</label>
                    <textarea
                      rows="2"
                      value={editingPattern.evidence_summary || ''}
                      onChange={(e) => setEditingPattern({ ...editingPattern, evidence_summary: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-navySlate/20 text-xs focus:outline-none focus:border-cyanAccent"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 text-xs font-bold">
                  <button
                    onClick={() => setShowCorrectPatternModal(false)}
                    className="px-4 py-2 rounded-xl text-navySlate/70 hover:bg-white"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleSaveCorrectPattern}
                    className="px-4 py-2 rounded-xl btn-cyan font-black shadow-md"
                  >
                    Save Changes ➔
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: PREDICTION VS REALITY FEEDBACK */}
          {showFeedbackModal && feedbackDecision && (
            <div className="fixed inset-0 bg-navySlate/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-panel p-6 rounded-3xl max-w-md w-full space-y-4 border border-white shadow-2xl">
                <div className="flex justify-between items-center border-b border-navySlate/10 pb-3">
                  <h3 className="font-extrabold text-base text-navySlate">Prediction vs. Reality Feedback</h3>
                  <button onClick={() => setShowFeedbackModal(false)} className="text-navySlate/60 hover:text-navySlate font-bold">✕</button>
                </div>

                <div className="text-xs text-navySlate/80 space-y-1">
                  <div className="font-bold text-navySlate">{feedbackDecision.question}</div>
                  <div className="text-[11px] text-cyanHover font-semibold">Chosen Scenario: {feedbackDecision.chosen_scenario}</div>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-navySlate mb-1">How did this decision turn out in real life? (1–5 Stars)</label>
                    <div className="flex gap-2">
                      {[1, 2, 3, 4, 5].map((star) => (
                        <button
                          key={star}
                          type="button"
                          onClick={() => setFeedbackRating(star)}
                          className={`text-2xl transition ${feedbackRating >= star ? 'text-amber-400' : 'text-slate-300'}`}
                        >
                          ★
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-navySlate mb-1">What actually happened?</label>
                    <textarea
                      rows="2"
                      value={feedbackOutcomeText}
                      onChange={(e) => setFeedbackOutcomeText(e.target.value)}
                      placeholder="e.g. Completed all lab modules before traveling; had zero anxiety."
                      className="w-full p-2.5 rounded-xl border border-navySlate/20 text-xs focus:outline-none focus:border-cyanAccent"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-navySlate mb-1">What should your Digital Twin learn for next time?</label>
                    <input
                      type="text"
                      value={feedbackNotes}
                      onChange={(e) => setFeedbackNotes(e.target.value)}
                      placeholder="e.g. Pre-trip sprints work well for me."
                      className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs focus:outline-none focus:border-cyanAccent"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 text-xs font-bold">
                  <button
                    onClick={() => setShowFeedbackModal(false)}
                    className="px-4 py-2 rounded-xl text-navySlate/70 hover:bg-white"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleSubmitRealityFeedback}
                    className="px-4 py-2 rounded-xl btn-cyan font-black shadow-md"
                  >
                    Save Reality Feedback ➔
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: RECORD NEW ACADEMIC GRADE */}
          {showRecordGradeModal && (
            <div className="fixed inset-0 bg-navySlate/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-panel p-6 sm:p-8 rounded-3xl max-w-md w-full space-y-4 border border-white shadow-2xl">
                <div className="flex justify-between items-center border-b border-navySlate/10 pb-3">
                  <h3 className="font-extrabold text-base text-navySlate">Record Assessment Result</h3>
                  <button onClick={() => setShowRecordGradeModal(false)} className="text-navySlate/60 hover:text-navySlate font-bold">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-navySlate mb-1">Enrolled Subject *</label>
                    <select
                      value={gradeSubjectId}
                      onChange={(e) => setGradeSubjectId(e.target.value)}
                      className="w-full p-2.5 rounded-xl border border-navySlate/20 text-xs bg-white focus:outline-none"
                    >
                      <option value="">Select Enrolled Subject</option>
                      {(state?.subjects || []).map((s) => (
                        <option key={s.id || s.name} value={s.id || s.name}>
                          {s.name} ({s.code || s.credits + " cr"})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block font-bold text-navySlate mb-1">Assessment Name *</label>
                    <input
                      type="text"
                      value={gradeAssessmentName}
                      onChange={(e) => setGradeAssessmentName(e.target.value)}
                      placeholder="e.g. Midterm Exam 1, Quiz 2, Project"
                      className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs focus:outline-none focus:border-cyanAccent"
                    />
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block font-bold text-navySlate mb-1">Score *</label>
                      <input
                        type="number"
                        value={gradeScore}
                        onChange={(e) => setGradeScore(e.target.value)}
                        placeholder="45"
                        className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-navySlate mb-1">Max Score *</label>
                      <input
                        type="number"
                        value={gradeMaxScore}
                        onChange={(e) => setGradeMaxScore(e.target.value)}
                        placeholder="50"
                        className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-navySlate mb-1">Weight (%)</label>
                      <input
                        type="number"
                        value={gradeWeight}
                        onChange={(e) => setGradeWeight(e.target.value)}
                        placeholder="25"
                        className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-navySlate mb-1">Teacher / Instructor Notes</label>
                    <input
                      type="text"
                      value={gradeNotes}
                      onChange={(e) => setGradeNotes(e.target.value)}
                      placeholder="e.g. Strong conceptual grasp of algorithms."
                      className="w-full px-3 py-2 rounded-xl border border-navySlate/20 text-xs"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 text-xs font-bold">
                  <button
                    onClick={() => setShowRecordGradeModal(false)}
                    className="px-4 py-2 rounded-xl text-navySlate/70 hover:bg-white"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleRecordNewGrade}
                    className="px-4 py-2 rounded-xl btn-cyan font-black shadow-md"
                  >
                    Save Grade ➔
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
